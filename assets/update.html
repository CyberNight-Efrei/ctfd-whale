{% extends "admin/challenges/update.html" %}

{% block value %}
<div class="form-group">
    <label for="value">Current Value</label>
    <input type="number" class="form-control chal-value" name="value" value="{{ challenge.value }}" disabled>
</div>
<div class="form-group">
    <label for="initial">Initial Value</label>
    <input type="number" class="form-control chal-initial" id="initial" name="initial" value="{{ challenge.initial }}" required>
</div>
<div class="form-group">
    <label for="decay">Decay Limit</label>
    <input type="number" class="form-control chal-decay" id="decay" name="decay" value="{{ challenge.decay }}" required>
</div>
<div class="form-group">
    <label for="minimum">Minimum Value</label>
    <input type="number" class="form-control chal-minimum" id="minimum" name="minimum" value="{{ challenge.minimum }}" required>
</div>
<div class="form-group">
    <label for="docker_image">Docker Image</label>
    <input type="text" class="form-control" id="docker_image" name="docker_image" value="{{ challenge.docker_image }}" required>
</div>

<div class="form-group">
    <label>Exposed ports<br>
        <small class="form-text text-muted">Manage the internal ports reachable by players. TCP/SSH ports receive an allocated public port; HTTP ports receive FRP subdomains.</small>
    </label>
    <input type="hidden" name="ports_json" id="ports_json" value='[{% for port in challenge.ports %}{"name": {{ port.name|tojson }}, "protocol": {{ port.protocol|tojson }}, "internal_port": {{ port.internal_port|int }} }{% if not loop.last %},{% endif %}{% endfor %}]'>
    <div class="table-responsive">
        <table class="table table-sm table-bordered">
            <thead><tr><th>Name</th><th>Protocol</th><th>Internal port</th><th></th></tr></thead>
            <tbody id="whale-ports-body"></tbody>
        </table>
    </div>
    <button type="button" class="btn btn-sm btn-secondary" id="whale-add-port">Add a port</button>
    <small class="form-text text-muted">Port names must be unique and use lowercase letters, digits, underscores or hyphens. Maximum: 20 ports.</small>
</div>

<div id="whale-ssh-fields" style="{% if challenge.ports|selectattr('protocol', 'equalto', 'ssh')|list|length %}display:block;{% else %}display:none;{% endif %}">
    <div class="form-group">
        <label for="user">SSH login user</label>
        <input type="text" class="form-control" id="user" name="user" value="{{ challenge.user or '' }}" placeholder="Login user">
    </div>
    <div class="form-group">
        <label for="password">SSH login password</label>
        <input type="text" class="form-control" id="password" name="password" value="{{ challenge.password or '' }}" placeholder="Login password">
    </div>
    <small class="form-text text-muted">These credentials are displayed for every SSH port in this challenge.</small>
</div>

<div class="form-group">
    <label for="memory_limit">Docker Container Memory Limit</label>
    <input type="text" class="form-control" id="memory_limit" name="memory_limit" value="{{ challenge.memory_limit }}" required>
</div>
<div class="form-group">
    <label for="cpu_limit">Docker Container CPU Limit</label>
    <input type="number" step="any" class="form-control" id="cpu_limit" name="cpu_limit" value="{{ challenge.cpu_limit }}" required>
</div>
<div class="form-group">
    <label for="dynamic_score">Score Type</label>
    <select class="form-control" name="dynamic_score" id="dynamic_score">
        <option value="0" {% if challenge.dynamic_score == 0 %}selected{% endif %}>Static Score</option>
        <option value="1" {% if challenge.dynamic_score == 1 %}selected{% endif %}>Dynamic Score</option>
    </select>
</div>

<script>
(function () {
    function initWhalePortEditor() {
        var body = document.getElementById('whale-ports-body');
        var hidden = document.getElementById('ports_json');
        var addButton = document.getElementById('whale-add-port');
        var sshFields = document.getElementById('whale-ssh-fields');
        if (!body || !hidden || !addButton || body.dataset.initialized === '1') return;
        body.dataset.initialized = '1';

        function readRows() {
            return Array.from(body.querySelectorAll('tr')).map(function (row) {
                return {name: row.querySelector('[data-port-name]').value.trim(), protocol: row.querySelector('[data-port-protocol]').value, internal_port: row.querySelector('[data-port-number]').value};
            });
        }
        function sync() {
            hidden.value = JSON.stringify(readRows());
            var hasSsh = readRows().some(function (port) { return port.protocol === 'ssh'; });
            sshFields.style.display = hasSsh ? 'block' : 'none';
            sshFields.querySelectorAll('input').forEach(function (input) { input.required = hasSsh; });
        }
        function addRow(port) {
            if (body.querySelectorAll('tr').length >= 20) return;
            var row = document.createElement('tr');
            var nameCell = document.createElement('td'), name = document.createElement('input');
            name.className = 'form-control form-control-sm'; name.required = true; name.maxLength = 32;
            name.pattern = '[a-zA-Z0-9][a-zA-Z0-9_-]{0,31}'; name.setAttribute('data-port-name', ''); name.value = port.name || ''; nameCell.appendChild(name);
            var protocolCell = document.createElement('td'), protocol = document.createElement('select');
            protocol.className = 'form-control form-control-sm'; protocol.setAttribute('data-port-protocol', '');
            [['http','HTTP'],['tcp','TCP'],['ssh','SSH']].forEach(function (item) { var option = document.createElement('option'); option.value = item[0]; option.textContent = item[1]; protocol.appendChild(option); });
            protocol.value = port.protocol || 'http'; protocolCell.appendChild(protocol);
            var numberCell = document.createElement('td'), number = document.createElement('input');
            number.type = 'number'; number.min = '1'; number.max = '65535'; number.required = true;
            number.className = 'form-control form-control-sm'; number.setAttribute('data-port-number', ''); number.value = port.internal_port || 80; numberCell.appendChild(number);
            var actionCell = document.createElement('td'), remove = document.createElement('button');
            remove.type = 'button'; remove.className = 'btn btn-sm btn-outline-danger'; remove.textContent = 'Remove';
            remove.addEventListener('click', function () { if (body.querySelectorAll('tr').length === 1) { name.value = ''; number.value = ''; protocol.value = 'http'; } else row.remove(); sync(); });
            actionCell.appendChild(remove); row.append(nameCell, protocolCell, numberCell, actionCell); body.appendChild(row);
            row.addEventListener('input', sync); row.addEventListener('change', sync); sync();
        }
        addButton.addEventListener('click', function () { addRow({name:'', protocol:'http', internal_port:80}); });
        var existing = [];
        try { existing = JSON.parse(hidden.value || '[]'); } catch (error) { existing = []; }
        if (!Array.isArray(existing) || existing.length === 0) existing = [{name:'web', protocol:'http', internal_port:80}];
        existing.forEach(addRow); sync();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWhalePortEditor);
    else initWhalePortEditor();
    if (window.jQuery) jQuery(document).on('shown.bs.modal', initWhalePortEditor);
})();
</script>
{% endblock %}
