version: "3.8"

# Minimal deployment matching the current VM networking:
# - FRPS uses the host network on the VM named "frps".
# - FRPC uses the existing "challenges" overlay to reach challenge services.
#   Its outbound connection to FRPS uses the VM network via docker_gwbridge.
# - One FRPC task is deployed on every worker labelled by the helper script.
#
# This file is for a clean deployment. If frpc/frps already exist, keep FRPS
# and recreate only FRPC as documented in docs/frpc-workers.md.
#
# Required environment:
#   FRP_TOKEN=...
#   FRPS_ADDRESS=frps.cybnsrv.rezo
#
# Deploy from the Swarm manager:
#   ./scripts/label-frpc-workers.sh
#   docker stack deploy --resolve-image never -c docker-stack.frp.example.yml frp

services:
  frps:
    image: ${FRPS_IMAGE:-frps-frps:latest}
    command:
      - "--bind_addr=0.0.0.0"
      - "--bind_port=7000"
      - "--token=${FRP_TOKEN:?Set FRP_TOKEN before deploying}"
      - "--subdomain_host=challenges.cybn.fr"
      - "--vhost_http_port=8000"
    networks:
      - host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == frps
      restart_policy:
        condition: any
        delay: 5s
        window: 60s

  frpc:
    image: ${FRPC_IMAGE:-frankli0324/frp:frpc}
    command:
      - "--server_addr=${FRPS_ADDRESS:-frps.cybnsrv.rezo}"
      - "--server_port=7000"
      - "--token=${FRP_TOKEN:?Set FRP_TOKEN before deploying}"
      - "--admin_addr=0.0.0.0"
      - "--admin_port=7400"
      - "--admin_user="
      - "--admin_pwd="
    ports:
      # One listener on each worker; CTFd reaches it at <node.Status.Addr>:7400.
      - target: 7400
        published: "7400"
        protocol: tcp
        mode: host
    networks:
      - challenges
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker
          - node.labels.ctfd_whale_frpc == true
      restart_policy:
        condition: any
        delay: 5s
        window: 60s

networks:
  # Built-in Docker host network (already present on each Swarm node).
  host:
    external: true
    name: host

  # Existing overlay shared by FRPC and the Whale challenge services.
  challenges:
    external: true
    name: ${CTFD_CONTAINERS_NETWORK:-challenges}
