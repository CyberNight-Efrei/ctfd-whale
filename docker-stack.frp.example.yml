version: "3.8"

# Deploy this file from the Swarm manager:
#   export FRP_TOKEN='...'
#   export FRP_SUBDOMAIN_HOST='challenges.example.org'
#   export CTFD_CONTAINERS_NETWORK='ctfd_frp-containers'
#   docker stack deploy -c docker-stack.frp.example.yml whale-frp
#
# This stack intentionally runs ONE FRPC replica. CTFd-Whale currently pushes
# dynamic route configuration to a single FRPC admin API endpoint.

services:
  frps:
    image: \${FRPS_IMAGE:-frankli0324/frp:frps}
    command:
      - "--bind_addr=0.0.0.0"
      - "--bind_port=\${FRP_SERVER_PORT:-7000}"
      - "--token=\${FRP_TOKEN:?Set FRP_TOKEN before deploying}"
      - "--subdomain_host=\${FRP_SUBDOMAIN_HOST:?Set FRP_SUBDOMAIN_HOST before deploying}"
      - "--vhost_http_port=\${FRP_VHOST_HTTP_PORT:-8080}"
    ports:
      - "\${FRP_SERVER_PORT:-7000}:\${FRP_SERVER_PORT:-7000}/tcp"
      - "\${FRP_VHOST_HTTP_PORT:-8080}:\${FRP_VHOST_HTTP_PORT:-8080}/tcp"
      # Keep this range aligned with whale:frp_direct_port_minimum /
      # whale:frp_direct_port_maximum. Remove it if direct TCP/SSH is unused.
      - "\${FRP_DIRECT_PORT_RANGE:-10000-10100}:\${FRP_DIRECT_PORT_RANGE:-10000-10100}/tcp"
    networks:
      frp:
        aliases:
          - frps
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == frps
      restart_policy:
        condition: any
        delay: 5s
        window: 60s

  frpc:
    image: \${FRPC_IMAGE:-frankli0324/frp:frpc}
    command:
      - "--server_addr=frps"
      - "--server_port=\${FRP_SERVER_PORT:-7000}"
      - "--token=\${FRP_TOKEN:?Set FRP_TOKEN before deploying}"
      - "--admin_addr=0.0.0.0"
      - "--admin_port=7400"
    ports:
      # CTFd reaches the FRPC admin API using the private IP of the ctfd node.
      # Restrict this port to CTFd with the host firewall.
      - target: 7400
        published: 7400
        protocol: tcp
        mode: host
    networks:
      frp:
        aliases:
          - frpc
      containers: {}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ctfd
      restart_policy:
        condition: any
        delay: 5s
        window: 60s

networks:
  # Private overlay used only for FRPC <-> FRPS control/data traffic.
  frp:
    driver: overlay
    attachable: true
    internal: true

  # Must be the same attachable overlay network Whale attaches challenge
  # services to (whale:docker_auto_connect_network).
  containers:
    external: true
    name: \${CTFD_CONTAINERS_NETWORK:-ctfd_frp-containers}
