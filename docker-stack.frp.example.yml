version: "3.8"

# Deploy this file from the Swarm manager.
# FRPS is pinned to the node whose hostname is "frps".
# FRPC runs in global mode on workers labelled by scripts/label-frpc-workers.sh.
# CTFd-Whale routes each challenge only through the FRPC on its hosting worker.
#
# Run the label script on the Swarm manager before deploying, then build/push
# your custom FRPS Dockerfile and deploy with:
#   export FRPS_IMAGE='registry.example.org/frps:your-version'
#   export FRP_TOKEN='replace-with-a-long-random-token'
#   export FRP_SUBDOMAIN_HOST='challenges.cybn.fr'
#   export CTFD_CONTAINERS_NETWORK='challenges'
#   docker stack deploy -c docker-stack.frp.example.yml whale-frp

services:
  frps:
    # docker stack deploy ignores "build"; this must be a pullable image.
    image: ${FRPS_IMAGE:?Build and push the custom FRPS image, then set FRPS_IMAGE}
    command:
      - "--bind_addr=0.0.0.0"
      - "--bind_port=${FRP_SERVER_PORT:-7000}"
      - "--token=${FRP_TOKEN:?Set FRP_TOKEN before deploying}"
      - "--subdomain_host=${FRP_SUBDOMAIN_HOST:?Set FRP_SUBDOMAIN_HOST before deploying}"
      - "--vhost_http_port=${FRP_VHOST_HTTP_PORT:-8000}"
    ports:
      # Default Swarm ingress mode publishes these ports on every node.
      # Point public DNS to the FRPS node and restrict inbound firewall rules.
      - "${FRP_SERVER_PORT:-7000}:${FRP_SERVER_PORT:-7000}/tcp"
      - "${FRP_VHOST_HTTP_PORT:-8000}:${FRP_VHOST_HTTP_PORT:-8000}/tcp"
      # Keep aligned with whale:frp_direct_port_minimum / maximum.
      - "${FRP_DIRECT_PORT_RANGE:-10000-10500}:${FRP_DIRECT_PORT_RANGE:-10000-10500}/tcp"
    networks:
      frp:
        aliases:
          - frps
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == frps
      restart_policy:
        condition: any
        delay: 5s
        window: 60s

  frpc:
    image: ${FRPC_IMAGE:-frankli0324/frp:frpc}
    command:
      - "--server_addr=frps"
      - "--server_port=${FRP_SERVER_PORT:-7000}"
      - "--token=${FRP_TOKEN:?Set FRP_TOKEN before deploying}"
      - "--admin_addr=0.0.0.0"
      - "--admin_port=7400"
      # CTFd-Whale currently sends unauthenticated HTTP requests to this API.
      - "--admin_user="
      - "--admin_pwd="
    ports:
      # One host-mode listener per worker. Restrict TCP/7400 to the CTFd manager IP.
      - target: 7400
        published: "7400"
        protocol: tcp
        mode: host
    networks:
      frp:
        aliases:
          - frpc
      containers: {}
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker
          - node.labels.ctfd_whale_frpc == true
      restart_policy:
        condition: any
        delay: 5s
        window: 60s

networks:
  # Private overlay used for FRPC <-> FRPS control/data traffic.
  frp:
    driver: overlay
    attachable: true
    internal: true

  # Reuse the existing external overlay shared with Whale challenge services.
  containers:
    external: true
    name: ${CTFD_CONTAINERS_NETWORK:-challenges}
